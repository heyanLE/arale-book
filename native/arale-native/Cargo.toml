[package]
name = "arale-native"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
unrar = "0.5"
tar = "0.4"
sevenz-rust = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
