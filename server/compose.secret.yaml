# Optional external token. File content is mounted at runtime, never in the image/env.
services:
  arale:
    environment:
      ARALE_SERVER_TOKEN_FILE: /run/secrets/arale_access_token
    secrets:
      - arale_access_token
secrets:
  arale_access_token:
    file: ${ARALE_TOKEN_FILE:?Set ARALE_TOKEN_FILE to an existing token file}
